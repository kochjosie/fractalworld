<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://use.typekit.net/ful6aok.css">
        <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
       
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
       
        <script src="walker.js"></script>
        <script src="script.js" defer></script>
        <script src="sketch.js" defer></script>
        <script src="virtualPot.js" defer></script>
    </head>
    <body>
        <div id="page-container">
            <div id="header">
                <h1>Welcome to the forest.</h1>
                <h2>If your browser allows, you can use web serial to control the seasons with a potentiometer.</h2>
            </div>
            <div id="row">
                <div id="canvas-and-buttons">
                    <div id="canvas-container"></div>
                    <div id="buttons">
                        <button id="arduino-option">Connect Arduino</button>
                        <button id="virtual-option">Virtual Control</button>
                    </div>
                    <div id="virtual-container" style="display:none;"></div>
                </div>
                <div id="dla-caption-container"><span id="dla-caption"></span></div>
            </div>
            <div id="more-info"><span id="more-info"></span></div>
        </div>
    </body>
</html>
